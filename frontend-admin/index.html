<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23111' width='32' height='32' rx='4'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23fff' font-family='system-ui'>知</text></svg>" />
  <title>知识配置平台 - 中后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/tailwind-config.js"></script>
  <link href="css/common.css" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-canvas text-slate-600 font-sans antialiased min-h-screen selection:bg-emerald-900 selection:text-white">
  <div id="app" class="flex min-h-screen">
    <aside class="app-sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon flex items-center justify-center">
          <span class="iconify" data-icon="lucide:book-open" data-width="20" data-height="20"></span>
        </div>
        <span class="sidebar-logo-text">知识配置平台</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item router-active"><span class="iconify nav-item-icon" data-icon="lucide:layout-dashboard" data-width="18" data-height="18"></span>概览</a>
        <a href="merchant.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:store" data-width="18" data-height="18"></span>商家知识</a>
        <a href="merchant-set.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:layers" data-width="18" data-height="18"></span>商家集合知识</a>
        <a href="industry.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:briefcase" data-width="18" data-height="18"></span>行业知识</a>
        <a href="global.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:globe" data-width="18" data-height="18"></span>通用知识</a>
      </nav>
    </aside>
    <main class="flex-1 flex flex-col min-w-0">
      <header class="app-header border-b border-slate-200">
        <span class="app-header-title text-slate-700 font-medium">知识配置平台</span>
      </header>
      <div class="flex-1 p-6 md:p-8 space-y-8">
        <div>
          <h2 class="section-title tracking-tight text-slate-900 mb-2">概览</h2>
          <p class="section-desc text-sm text-slate-500">从左侧导航进入：商家知识、商家集合知识、行业知识、通用知识。</p>
        </div>
        <section class="premium-card rounded-xl border border-slate-100 shadow-sm overflow-hidden" id="overviewStatsWrap">
          <div class="grid grid-cols-2 lg:grid-cols-4 divide-x divide-slate-100" id="overviewStats">
            <!-- 由脚本填充 -->
          </div>
        </section>

        <!-- 图表：不同类型知识数量 & 占比 -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="premium-card rounded-xl border border-slate-100 shadow-sm p-6">
            <h3 class="text-base font-semibold text-slate-900 mb-4">各类型知识数量</h3>
            <div class="h-64 md:h-72">
              <canvas id="chartBar"></canvas>
              <div id="chartBarEmpty" class="h-full hidden flex-col items-center justify-center text-center">
                <span class="iconify text-slate-300 mb-2" data-icon="lucide:bar-chart-3" data-width="32" data-height="32"></span>
                <p class="text-sm text-slate-400">暂无知识数据，新增知识后这里将展示各类型知识数量</p>
              </div>
            </div>
          </div>
          <div class="premium-card rounded-xl border border-slate-100 shadow-sm p-6">
            <h3 class="text-base font-semibold text-slate-900 mb-4">知识类型占比</h3>
            <div class="h-64 md:h-72">
              <canvas id="chartPie"></canvas>
              <div id="chartPieEmpty" class="h-full hidden flex-col items-center justify-center text-center">
                <span class="iconify text-slate-300 mb-2" data-icon="lucide:pie-chart" data-width="32" data-height="32"></span>
                <p class="text-sm text-slate-400">暂无知识数据，新增知识后这里将展示知识类型占比</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="js/mock.js"></script>
  <script src="js/common.js"></script>
  <script>
(function () {
  var container = document.getElementById('overviewStats');
  if (!container) return;

  // 概览页所有数字与图表统一以 MockStore.getOverviewStats() 为唯一数据源，
  // 与商家/集合/行业列表页使用同一批 MockStore getter，保证口径一致。
  function getOverviewStats() {
    if (typeof MockStore !== 'undefined' && typeof MockStore.getOverviewStats === 'function') {
      return MockStore.getOverviewStats();
    }
    return {
      merchantCount: 0,
      merchantKnowledgeCount: 0,
      merchantSetCount: 0,
      merchantSetKnowledgeCount: 0,
      industryCount: 0,
      industryKnowledgeCount: 0,
      globalKnowledgeCount: 0,
      totalKnowledgeCount: 0
    };
  }

  var statItems = [
    { key: 'totalKnowledgeCount', label: '总知识数量', unit: '条', icon: 'lucide:book-open' },
    { key: 'merchantCount', label: '商家', unit: '家', icon: 'lucide:store' },
    { key: 'merchantSetCount', label: '商家集合', unit: '个', icon: 'lucide:layers' },
    { key: 'industryCount', label: '行业数量', unit: '个', icon: 'lucide:briefcase' }
  ];

  // 首次构建统计卡片，数值放在带 id 的 span 中，刷新时只更新数字
  container.innerHTML = statItems.map(function (item) {
    return '<div class="flex flex-col items-center justify-center py-6 px-4 text-center min-w-0">' +
      '<span class="iconify mb-2 text-slate-400" data-icon="' + item.icon + '" data-width="22" data-height="22"></span>' +
      '<div class="text-xs font-medium uppercase tracking-wider text-slate-500 mb-1">' + item.label + '</div>' +
      '<div class="flex items-baseline justify-center gap-1">' +
        '<span id="stat-' + item.key + '" class="text-2xl md:text-3xl font-semibold text-slate-900 tabular-nums">0</span>' +
        '<span class="text-sm text-slate-500">' + item.unit + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  // 图表配色（柔和区分、耐看）
  var chartLabels = ['商家知识', '商家集合知识', '行业知识', '通用知识'];
  var chartKeys = ['merchantKnowledgeCount', 'merchantSetKnowledgeCount', 'industryKnowledgeCount', 'globalKnowledgeCount'];
  var chartColors = ['#7c3aed', '#0891b2', '#059669', '#d97706'];
  var chartColorsLight = ['#a78bfa', '#22d3ee', '#34d399', '#fbbf24'];

  var barChart = null;
  var pieChart = null;

  function buildCounts(s) {
    return chartKeys.map(function (k) { return s[k]; });
  }

  function setEmptyVisible(emptyEl, visible) {
    emptyEl.classList.toggle('hidden', !visible);
    emptyEl.classList.toggle('flex', visible);
  }

  function renderStats(s) {
    statItems.forEach(function (item) {
      var el = document.getElementById('stat-' + item.key);
      if (el) el.textContent = Number(s[item.key]) || 0;
    });
  }

  // 柱状图与饼图共用同一份 chartCounts，合计必然吻合
  function renderCharts(chartCounts) {
    var hasData = chartCounts.some(function (v) { return v > 0; });

    var barCanvas = document.getElementById('chartBar');
    var pieCanvas = document.getElementById('chartPie');
    var barEmpty = document.getElementById('chartBarEmpty');
    var pieEmpty = document.getElementById('chartPieEmpty');

    if (typeof Chart === 'undefined') return;

    // 无数据时销毁图表并给出说明，避免空白画布
    if (!hasData) {
      if (barChart) { barChart.destroy(); barChart = null; }
      if (pieChart) { pieChart.destroy(); pieChart = null; }
      if (barCanvas) barCanvas.style.display = 'none';
      if (pieCanvas) pieCanvas.style.display = 'none';
      setEmptyVisible(barEmpty, true);
      setEmptyVisible(pieEmpty, true);
      return;
    }

    if (barCanvas) barCanvas.style.display = '';
    if (pieCanvas) pieCanvas.style.display = '';
    setEmptyVisible(barEmpty, false);
    setEmptyVisible(pieEmpty, false);

    // 柱状图：从 0 开始保证柱子可见，Y 轴整数
    if (!barChart && barCanvas) {
      barChart = new Chart(barCanvas, {
        type: 'bar',
        data: {
          labels: chartLabels,
          datasets: [{
            label: '知识数量（条）',
            data: chartCounts,
            backgroundColor: chartColorsLight,
            borderColor: chartColors,
            borderWidth: 1,
            borderRadius: 6,
            borderSkipped: false,
            barPercentage: 0.6,
            categoryPercentage: 0.65
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: '数值',
                font: { size: 12 },
                color: '#64748b'
              },
              ticks: {
                font: { size: 12 },
                color: '#94a3b8',
                stepSize: 1,
                callback: function (v) { return Number.isInteger(v) ? v : ''; }
              },
              grid: { color: 'rgba(148,163,184,0.2)' }
            },
            x: {
              ticks: { font: { size: 11 }, color: '#64748b', maxRotation: 25 },
              grid: { display: false }
            }
          }
        }
      });
    } else if (barChart) {
      barChart.data.labels = chartLabels;
      barChart.data.datasets[0].data = chartCounts;
      barChart.update();
    }

    // 饼图：与柱状图同色系
    if (!pieChart && pieCanvas) {
      pieChart = new Chart(pieCanvas, {
        type: 'pie',
        data: {
          labels: chartLabels,
          datasets: [{
            data: chartCounts,
            backgroundColor: chartColorsLight,
            borderColor: '#ffffff',
            borderWidth: 3,
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { font: { size: 12 }, color: '#475569', padding: 14, usePointStyle: true }
            },
            tooltip: {
              backgroundColor: 'rgba(15,23,42,0.9)',
              padding: 12,
              titleFont: { size: 13 },
              bodyFont: { size: 12 },
              callbacks: {
                label: function (ctx) {
                  var total = ctx.dataset.data.reduce(function (a, b) { return a + b; }, 0);
                  var pct = total ? ((ctx.raw / total) * 100).toFixed(1) : 0;
                  return ctx.label + '：' + ctx.raw + ' 条（' + pct + '%）';
                }
              }
            }
          }
        }
      });
    } else if (pieChart) {
      pieChart.data.labels = chartLabels;
      pieChart.data.datasets[0].data = chartCounts;
      pieChart.update();
    }
  }

  // 每次进入概览页都基于最新存储重新渲染（首次加载 + bfcache 恢复）
  function refresh() {
    var s = getOverviewStats();
    renderStats(s);
    renderCharts(buildCounts(s));
  }

  refresh();
  window.addEventListener('pageshow', function (event) {
    // 从浏览器前进/后退缓存（bfcache）恢复时页面脚本不会重新执行，需手动刷新
    if (event.persisted) refresh();
  });
})();
  </script>
</body>
</html>
